  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{pageDescription}}">
  <meta name="theme-color" content="#0A1628">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="{{data.domain}}{{page.path}}">
  <link rel="alternate" hreflang="{{lang}}" href="{{data.domain}}{{page.path}}">
  <link rel="alternate" hreflang="{{alt.lang}}" href="{{data.domain}}{{page.alt}}">
  <link rel="alternate" hreflang="x-default" href="{{data.domain}}{{xDefault}}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="{{locale}}">
  <meta property="og:site_name" content="Nexus Diamond Team">
  <meta property="og:title" content="{{pageTitle}}">
  <meta property="og:description" content="{{pageDescription}}">
  <meta property="og:url" content="{{data.domain}}{{page.path}}">
  <meta property="og:image" content="{{data.domain}}/assets/img/bernardo-retrato-900.webp">
  <meta property="og:image:alt" content="{{meta.ogAlt}}">
  <link rel="icon" href="{{base}}assets/brand/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{base}}assets/brand/favicon-32x32.png">
  <link rel="apple-touch-icon" href="{{base}}assets/brand/apple-touch-icon.png">
  <link rel="preload" href="{{base}}assets/fonts/cormorant-garamond-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{base}}assets/fonts/manrope-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{base}}assets/css/main.css">
  <script>
    (function (d) {
      var h = d.documentElement;
      h.classList.replace('no-js', 'js');
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        h.classList.add('motion');
        window.__revealFallback = setTimeout(function () { h.classList.add('motion-failed'); }, 3000);
      }
    })(document);
  </script>
